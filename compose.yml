services:
  api:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      SQLITE_PATH: /data/norte.db
      TOMBSTONE_TTL_DAYS: "90"
      MAX_UPLOAD_BYTES: "10485760"
    volumes:
      - ./data:/data
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
